<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calendriers des équipes – Doudeville Accueil Échecs</title>
<link rel="stylesheet" href="style.css">
<meta name="description" content="Calendrier 2026-2027 des équipes de Doudeville Accueil Échecs en Régionale Normandie, groupe D : dates, lieux et adversaires de chaque ronde.">
<link rel="canonical" href="https://doudeville-echecs.fr/calendriers.html">
<meta name="theme-color" content="#0b3391">
<meta property="og:type" content="website">
<meta property="og:locale" content="fr_FR">
<meta property="og:site_name" content="Doudeville Accueil Échecs">
<meta property="og:title" content="Calendriers des équipes – Doudeville Accueil Échecs">
<meta property="og:description" content="Calendrier 2026-2027 des équipes de Doudeville Accueil Échecs en Régionale Normandie, groupe D : dates, lieux et adversaires de chaque ronde.">
<meta property="og:url" content="https://doudeville-echecs.fr/calendriers.html">
<meta property="og:image" content="https://doudeville-echecs.fr/images/partage.jpg">
<meta name="twitter:card" content="summary_large_image">
</head>
<body>
<main><div class="wrap">
  <h1 class="page">Calendriers</h1>
  <p class="lead">Saison 2026-2027 · les matchs de chaque équipe du club.</p>

  <div class="tabs" id="tabs" role="group" aria-label="Choisir une équipe"></div>
  <div id="view"></div>
</div></main>
<script src="data.js"></script>
<script src="calendrier.js"></script>
<script src="site.js"></script>
<script>
const tabs = document.getElementById("tabs"), view = document.getElementById("view");

function ligne(m) {
  if (m.repos) return `<tr class="bye"><td>${m.ronde}</td><td>${cap(fmtDate(m.date))}</td><td colspan="4">Exempt (pas de match)</td></tr>`;
  const cls = [m.dom ? "home" : "", m.date < todayISO() ? "past" : ""].join(" ");
  return `<tr class="${cls}"><td>${m.ronde}</td><td>${cap(fmtDate(m.date))} · ${m.heure.replace(":", "h")}</td>
    <td>${esc(m.blancs)}</td><td>${esc(m.noirs)}</td><td>${esc(m.lieu)}</td><td>${fmtScore(m.res)}</td></tr>`;
}
const head = `<thead><tr><th>Ronde</th><th>Date</th><th>Blancs</th><th>Noirs</th><th>Lieu</th><th>Score</th></tr></thead>`;

/* Bilan calculé à partir des scores publiés par la FFE (ex. "2.5-1.5") */
function bilan(ms) {
  const { v, n, d, pour, contre, joues } = stats(ms);
  if (!joues) return "";
  return `<p><strong>Bilan :</strong> ${v} victoire${v > 1 ? "s" : ""}, ${n} nul${n > 1 ? "s" : ""}, ${d} défaite${d > 1 ? "s" : ""} · parties ${fmtNum(pour)} – ${fmtNum(contre)}</p>`;
}

function equipe(e) {
  const ms = matchsEquipe(e.nom);
  view.innerHTML = `
    <h2>${esc(e.nom)} <span class="tag">${esc(e.categorie)}</span></h2>
    <p class="meta" style="color:var(--muted);margin-top:-6px">${esc(e.competition)}</p>
    ${bilan(ms)}
    <div class="table-scroll"><table>${head}<tbody>${ms.map(ligne).join("")}</tbody></table></div>
    <p class="legend"><span class="swatch"></span>Match à domicile · Source : <a href="${e.source}" rel="noopener">calendrier officiel FFE</a> · Mis à jour le ${fmtDate(MAJ)}</p>`;
}

const items = EQUIPES.map(e => ({ label: e.nom, fn: () => equipe(e) }));
items.forEach((it, i) => {
  const b = document.createElement("button");
  b.textContent = it.label;
  b.onclick = () => { [...tabs.children].forEach(x => x.setAttribute("aria-pressed", x === b)); it.fn(); history.replaceState(null, "", "#" + i); };
  tabs.appendChild(b);
});
const start = Math.min(+location.hash.slice(1) || 0, items.length - 1);
tabs.children[start].click();
</script>
</body>
</html>
