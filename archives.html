<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Archives et histoire du club – Doudeville Accueil Échecs</title>
<link rel="stylesheet" href="style.css">
<style>
  .histoire p { max-width: 68ch; }
  .archive-photos { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  .archive-photos figure { margin: 0; }
  .archive-photos img { width: 100%; height: auto; display: block; border-radius: 8px; }
  .archive-photos figcaption { font-size: 14px; color: var(--muted); margin-top: 6px; }
</style>
<meta name="description" content="L'histoire du club d'échecs de Doudeville, créé en 1997, et les souvenirs de l'ancien site : titres, actualités et photos d'archives.">
<link rel="canonical" href="https://doudeville-echecs.fr/archives.html">
<meta name="theme-color" content="#0b3391">
<meta property="og:type" content="website">
<meta property="og:locale" content="fr_FR">
<meta property="og:site_name" content="Doudeville Accueil Échecs">
<meta property="og:title" content="Archives et histoire du club – Doudeville Accueil Échecs">
<meta property="og:description" content="L'histoire du club d'échecs de Doudeville, créé en 1997, et les souvenirs de l'ancien site : titres, actualités et photos d'archives.">
<meta property="og:url" content="https://doudeville-echecs.fr/archives.html">
<meta property="og:image" content="https://doudeville-echecs.fr/images/partage.jpg">
<meta name="twitter:card" content="summary_large_image">
</head>
<body>
<main><div class="wrap">
  <h1 class="page">Archives</h1>
  <p class="lead">L'histoire du club et les souvenirs de l'ancien site (2013-2016).</p>

  <h2>Histoire du club</h2>
  <div class="histoire" id="histoire"></div>

  <h2>Actualités d'hier</h2>
  <div class="grid" style="grid-template-columns:1fr" id="actus"></div>

  <h2>Photos d'archives</h2>
  <div class="archive-photos" id="photos"></div>

  <p class="legend" style="margin-top:32px">Contenus repris de l'ancien site du club, <em>dae-doudeville.clubeo.com</em>.</p>
</div></main>
<script src="data.js"></script>
<script src="site.js"></script>
<script>
const A = ARCHIVES;
document.getElementById("histoire").innerHTML =
  A.histoire.paragraphes.map(p => `<p>${esc(p)}</p>`).join("") +
  `<p class="legend">${esc(A.histoire.note)}</p>`;
document.getElementById("actus").innerHTML = A.actus.map(a =>
  `<article class="card"><h3>${esc(a.titre)}</h3><div class="meta">${cap(fmtDate(a.date, true))}</div><p>${esc(a.texte)}</p></article>`).join("");
document.getElementById("photos").innerHTML = A.photos.length
  ? A.photos.map(p => `<figure><a href="images/archives/${esc(p.fichier)}" target="_blank" rel="noopener"><img src="images/archives/${esc(p.fichier)}" alt="${esc(p.alt)}" loading="lazy"></a>${p.legende ? `<figcaption>${esc(p.legende)}</figcaption>` : ""}</figure>`).join("")
  : `<div class="empty">Aucune photo pour le moment.</div>`;
</script>
</body>
</html>
