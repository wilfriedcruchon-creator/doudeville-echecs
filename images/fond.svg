<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".85"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="m"><rect width="1600" height="1000" fill="url(#fade)"/></mask>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2b23a"/><stop offset="1" stop-color="#a87400"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a63c4"/><stop offset="1" stop-color="#0b3391"/>
    </linearGradient>
    <g id="pawn">
      <circle cx="0" cy="-118" r="30"/>
      <path d="M-22 -90 h44 l-6 14 h-32 z"/>
      <path d="M-18 -74 h36 c4 40 26 62 40 82 h-116 c14 -20 36 -42 40 -82 z"/>
      <rect x="-64" y="8" width="128" height="16" rx="8"/>
    </g>
    <g id="rook">
      <rect x="-46" y="-150" width="26" height="30"/><rect x="-13" y="-150" width="26" height="30"/><rect x="20" y="-150" width="26" height="30"/>
      <rect x="-50" y="-122" width="100" height="16" rx="3"/>
      <path d="M-36 -104 h72 l10 100 h-92 z"/>
      <rect x="-64" y="-6" width="128" height="16" rx="8"/>
      <rect x="-72" y="8" width="144" height="16" rx="8"/>
    </g>
    <g id="king">
      <rect x="-5" y="-190" width="10" height="34"/><rect x="-17" y="-178" width="34" height="10"/>
      <path d="M0 -152 c-30 0 -46 20 -46 40 c0 16 12 26 22 32 l-12 74 h72 l-12 -74 c10 -6 22 -16 22 -32 c0 -20 -16 -40 -46 -40 z"/>
      <rect x="-60" y="-8" width="120" height="16" rx="8"/>
      <rect x="-70" y="6" width="140" height="18" rx="8"/>
    </g>
  </defs>

  <!-- damier en perspective, qui s'efface vers le haut à gauche -->
  <g mask="url(#m)" opacity=".12">
    <g transform="translate(700 470) rotate(-14) skewX(-18)" fill="url(#blue)">
      <g id="row"><rect x="0" y="0" width="90" height="90"/><rect x="180" y="0" width="90" height="90"/><rect x="360" y="0" width="90" height="90"/><rect x="540" y="0" width="90" height="90"/><rect x="720" y="0" width="90" height="90"/></g>
      <use href="#row" x="90" y="90"/>
      <use href="#row" x="0" y="180"/>
      <use href="#row" x="90" y="270"/>
      <use href="#row" x="0" y="360"/>
      <use href="#row" x="90" y="450"/>
    </g>
  </g>

  <!-- pièces en silhouette -->
  <g fill="url(#gold)">
    <use href="#king" transform="translate(1330 700) scale(2.1)" opacity=".13"/>
    <use href="#rook" transform="translate(1000 800) scale(1.3)" opacity=".11"/>
    <use href="#pawn" transform="translate(1500 860) scale(1)" opacity=".10"/>
    <use href="#pawn" transform="translate(300 880) scale(.9)" opacity=".07"/>
  </g>

  <!-- cercles et lignes -->
  <g fill="none" stroke="url(#gold)" stroke-width="2" opacity=".15">
    <circle cx="1290" cy="470" r="200"/><circle cx="1290" cy="470" r="290"/><circle cx="1290" cy="470" r="380"/>
    <path d="M0 780 L820 0 M0 900 L940 0 M120 1000 L1060 60"/>
  </g>
</svg>
