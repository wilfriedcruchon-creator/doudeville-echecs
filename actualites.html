<body>
<main><div class="wrap">
  <h1 class="page">Actualités</h1>
  <p class="lead">La vie du club, les résultats et les annonces.</p>
  <div class="grid" style="grid-template-columns:1fr" id="list"></div>
</div></main>
<script src="data.js"></script>
<script src="site.js"></script>
<script>
document.getElementById("list").innerHTML = ACTUALITES.length
  ? ACTUALITES.map(a => `<article class="card"><h3>${esc(a.titre)}</h3>
      <div class="meta">${cap(fmtDate(a.date, true))}</div><p>${esc(a.texte)}</p></article>`).join("")
  : `<div class="empty">Aucune actualité pour le moment.</div>`;
</script>
