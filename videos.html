<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vidéos du club d'échecs de Doudeville – Doudeville Accueil Échecs</title>
<link rel="stylesheet" href="style.css">
<meta name="description" content="Les vidéos du club d'échecs de Doudeville : tournois, séances et événements.">
<link rel="canonical" href="https://doudeville-echecs.fr/videos.html">
<meta name="theme-color" content="#0b3391">
<meta property="og:type" content="website">
<meta property="og:locale" content="fr_FR">
<meta property="og:site_name" content="Doudeville Accueil Échecs">
<meta property="og:title" content="Vidéos du club d'échecs de Doudeville – Doudeville Accueil Échecs">
<meta property="og:description" content="Les vidéos du club d'échecs de Doudeville : tournois, séances et événements.">
<meta property="og:url" content="https://doudeville-echecs.fr/videos.html">
<meta property="og:image" content="https://doudeville-echecs.fr/images/partage.jpg">
<meta name="twitter:card" content="summary_large_image">
<style>
  .videos { display: grid; gap: 22px; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
  .video { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--bg); }
  .video .lecteur { position: relative; aspect-ratio: 16 / 9; background: #0a1330; }
  .video .lecteur iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .video .jouer {
    position: absolute; inset: 0; width: 100%; height: 100%; border: 0; cursor: pointer; color: #fff;
    display: grid; place-content: center; justify-items: center; gap: 12px; font: inherit;
    background: linear-gradient(135deg, #0a2570, #0b3391 60%, #1b4fc0);
  }
  .video .jouer.vignette { background-size: cover; background-position: center; }
  .video .jouer .rond { width: 68px; height: 68px; border-radius: 50%; background: var(--gold); display: grid; place-items: center; box-shadow: 0 6px 20px rgba(0, 0, 0, .35); transition: transform .15s; }
  .video .jouer:hover .rond, .video .jouer:focus-visible .rond { transform: scale(1.08); }
  .video .jouer .rond::before { content: ""; margin-left: 5px; border-style: solid; border-width: 13px 0 13px 22px; border-color: transparent transparent transparent #10204f; }
  .video .jouer small { opacity: .85; font-size: 13px; padding: 0 16px; text-align: center; }
  .video .infos { padding: 14px 16px 16px; }
  .video h3 { margin: 0 0 4px; font-size: 17px; }
  .video .meta { color: var(--muted); font-size: 14px; }
  .video p { margin: 8px 0 0; }
  .video a.yt { font-size: 14px; }
</style>
</head>
<body>
<main><div class="wrap">
  <h1 class="page">Vidéos</h1>
  <p class="lead">Tournois, séances et événements du club en vidéo.</p>
  <div id="liste"></div>
  <p class="legend">Les vidéos sont hébergées sur YouTube et ne se chargent qu'au clic, sans cookies de suivi.</p>
</div></main>
<script src="data.js"></script>
<script src="site.js"></script>
<script>
const liste = document.getElementById("liste");
if (!VIDEOS.length) {
  liste.innerHTML = `<div class="empty">Aucune vidéo pour le moment.</div>`;
} else {
  liste.className = "videos";
  liste.innerHTML = VIDEOS.map((v, i) => {
    const id = idYoutube(v.video);
    if (!id) return "";
    const vignette = v.vignette ? ` vignette" style="background-image:url('${esc(v.vignette)}')` : "";
    return `<article class="video">
      <div class="lecteur" data-id="${esc(id)}" data-titre="${esc(v.titre)}">
        <button class="jouer${vignette}" type="button" aria-label="Lire la vidéo : ${esc(v.titre)}">
          <span class="rond"></span><small>La vidéo se charge depuis YouTube au clic</small>
        </button>
      </div>
      <div class="infos">
        <h3>${esc(v.titre)}</h3>
        ${v.date ? `<div class="meta">${cap(fmtDate(v.date, true))}</div>` : ""}
        ${v.legende ? `<p>${esc(v.legende)}</p>` : ""}
        <p><a class="yt" href="https://www.youtube.com/watch?v=${esc(id)}" target="_blank" rel="noopener">Voir sur YouTube</a></p>
      </div></article>`;
  }).join("");

  liste.addEventListener("click", e => {
    const b = e.target.closest(".jouer"); if (!b) return;
    const zone = b.parentElement;
    const f = document.createElement("iframe");
    /* Lecteur YouTube sans cookies ; suggestions de fin limitées à la chaîne du club ; interface allégée */
    f.src = `https://www.youtube-nocookie.com/embed/${zone.dataset.id}?autoplay=1&rel=0&modestbranding=1&playsinline=1`;
    f.title = zone.dataset.titre;
    f.allow = "accelerometer; autoplay; encrypted-media; picture-in-picture; fullscreen";
    f.allowFullscreen = true;
    f.referrerPolicy = "strict-origin-when-cross-origin";
    zone.replaceChildren(f);
  });
}
</script>
</body>
</html>
