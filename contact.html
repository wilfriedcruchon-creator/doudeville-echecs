<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">

<link rel="stylesheet" href="style.css">
<meta name="description" content="Contacter le club d'échecs de Doudeville : salle de jeu à l'Hôtel de Ville, horaires des séances, e-mail, téléphone et inscription.">
<link rel="canonical" href="https://doudeville-echecs.fr/contact.html">
<meta name="theme-color" content="#0b3391">
<meta property="og:type" content="website">
<meta property="og:locale" content="fr_FR">
<meta property="og:site_name" content="Doudeville Accueil Échecs">
<meta property="og:title" content="Contact – Doudeville Accueil Échecs">
<meta property="og:description" content="Contacter le club d'échecs de Doudeville : salle de jeu à l'Hôtel de Ville, horaires des séances, e-mail, téléphone et inscription.">
<meta property="og:url" content="https://doudeville-echecs.fr/contact.html">

<meta name="twitter:card" content="summary_large_image">
</head>
<body>
<main><div class="wrap">
  <h1 class="page">Contact</h1>
  <p class="lead">Une question, une envie de nous rejoindre ? Écrivez-nous.</p>
  <dl class="info" id="coords"></dl>

  <h2>Inscription</h2>
  <p>Vous souhaitez rejoindre le club ? <a href="inscription.html">Remplissez le formulaire d'inscription →</a></p>
</div></main>
<script src="data.js"></script>
<script src="site.js"></script>
<script>
const mail = /^\[/.test(CLUB.email) ? ph(CLUB.email) : `<a href="mailto:${esc(CLUB.email)}">${esc(CLUB.email)}</a>`;
document.getElementById("coords").innerHTML = `
  <dt>Club</dt><dd>${esc(CLUB.nom)}, ${esc(CLUB.ville)}</dd>
  <dt>Salle de jeu</dt><dd>${ph(CLUB.salle)}</dd>
  <dt>Séances</dt><dd>${ph(CLUB.horaires)}</dd>
  <dt>E-mail</dt><dd>${mail}</dd>
  <dt>Téléphone</dt><dd>${ph(CLUB.telephone)}</dd>
  <dt>Président</dt><dd>${ph(CLUB.president)}</dd>
  <dt>Webmaster</dt><dd>${esc(CLUB.webmaster)} · <a href="mailto:${esc(CLUB.emailWebmaster)}">${esc(CLUB.emailWebmaster)}</a></dd>`;
</script>
</body>
</html>
